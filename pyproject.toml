[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bartw"
version = "0.1.0"
description = "Bar pattern speeds of DESI star-forming dwarf galaxies with the Tremaine-Weinberg method"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Robin Thomas" }, { name = "Virginia Cuomo" }]
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "astropy>=6.0", "astroquery>=0.4.7",
  "pyvo>=1.5", "photutils>=1.12", "matplotlib>=3.8", "pandas>=2.1", "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["bartw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
